openapi: 3.0.1
info:
  title: Transpa Public API
  description: >
    # This API exposes functionality in Visma Transpa.

    ## Authentication

    The API can be tested without authentication against the mock server in the **Servers** pulldown list.
    To test against the actual backend you have to register a user on the *Visma Developer Portal* and request
    access to the API along with the required scopes. The scopes required are documented under each endpoint.
    For more information about *Visma Developer Portal* see <https://developer.visma.com>.
    <br/>
    <br/>


    Authentication uses OAuth tokens from *Visma Connect*. Authorization is done on tenant level, so one OAuth
    token is needed per tenant.<br/>
    <br/>
    The scope `transpaapi:api` grants basic access to the API and is required for all routes. Additional scopes might be required and are described inside each route description.
    <br/>

    ## Details

    All datetimes returned are in UTC (Zulu), and all datetimes sent to any endpoint will be interpreted as UTC unless the timezone is specified. Time is generally only measured in minutes, or otherwise specified.
    <br/>
    <br/>
    All monetary amounts are in the organizations local currency unless otherwise specified.
    <br/>
    <br/>
    ```[Not Ready]``` This is an endpoint where development has not completed and is therefore subject to change.
    <br/>
    <br/>
    The system is protected with throttling on two levels The first level is per client. Your assigned quota can be increased. The second level is the global level.

  version: '0.1.138'
  contact:
    name: Visma Transpa
    url: 'https://www.visma.se/tid-och-projekthantering/tidrapportering-transport/'
    email: api.transpa@visma.com
servers:
  - url: 'https://api.mytranspa.com/publicApi/'
  - url: 'https://api.mytranspa.com/publicApiMock/'
paths:
  /v1/alive:
    get:
      tags:
        - alive
      summary: Alive
      description: 'Check if the service is responsive'
      operationId: get-alivecontroller
      responses:
        '200':
          description: ''
        '429':
          $ref: '#/components/responses/429Throttling'
  # ----------------------------------------------------------------------
  /v1/employees:
    get:
      tags:
        - employees
      summary: 'Return a list of Employees'
      security:
        - visma_connect: [ "transpaapi:employees:read" ]
      description: >
        Returns a list of Employees


        Required scope transpaapi:employees:read
      operationId: get-employees
      parameters:
        - $ref: '#/components/parameters/cursorQueryParameter'
        - $ref: '#/components/parameters/limitParameter'
        - name: includeInactive
          description: 'Will include non active employees if set to true'
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'Return a list of Employees'
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    $ref: '#/components/schemas/cursorDto'
                  items:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/employee'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'
    post:
      tags:
        - employees
      summary: 'Create an employee'
      security:
        - visma_connect: [ "transpaapi:employees:write" ]
      description: >
        Required scope transpaapi:employees:write
      operationId: post-employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/employee'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/employee'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'
  /v1/employees/{id}:
    get:
      tags:
        - employees
      summary: 'Get an Employee'
      security:
        - visma_connect: [ "transpaapi:employees:read" ]
      description: >
        Required scope transpaapi:employees:read
      operationId: get-employee
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '200':
          description: 'Get a single Employee by id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/employee'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Employee does not exist'
        '429':
          $ref: '#/components/responses/429Throttling'
  /v1/employees/{id}/salaryConfiguration:
    get:
      tags:
        - salaries
      summary: 'Get salary configuration for an employee'
      security:
        - visma_connect: [ "transpaapi:employeesalaryconfigurations:read" ]
      description: >
        Required scope transpaapi:employeesalaryconfigurations:read
      operationId: get-employee-salaryConfigurations
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '200':
          description: 'Get salary configuration for the employee'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/salaryConfiguration'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: ''
        '429':
          $ref: '#/components/responses/429Throttling'
    put:
      tags:
        - salaries
      summary: 'Update salary configuration for an employee'
      security:
        - visma_connect: [ "transpaapi:employeesalaryconfigurations:write" ]
      description: >
        Update a salaryConfiguration


        Required scope transpaapi:employeesalaryconfigurations:write
      operationId: put-employee-salaryConfigurations
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/salaryConfiguration'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/salaryConfiguration'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Employee does not exist'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  # ----------------------------------------------------------------------
  /v1/employee/{id}/employeeContracts:
    get:
      tags:
        - employees
      summary: 'Returns employee contracts for the employees'
      security:
        - visma_connect: [ "transpaapi:employeecontracts:read" ]
      description: >
        Returns employee contracts for the employee


        Required scope transpaapi:employeecontracts:read
      operationId: get-employeeContracts
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '200':
          description: 'Returns employee contracts for the employee'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/employeeContract'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'
  # ----------------------------------------------------------------------
  /v1/calculateAdjustedWorkTime:
    post:
      tags:
        - timereports and shifts
      summary: 'Calculates the adjusted work time of a TimeReport or Shift'
      security:
        - visma_connect: [ "transpaapi:shifts:write", "transpaapi:timereports:write" ]
      description: >
        Required scope transpaapi:shifts:write or transpaapi:timereports:write
      operationId: post-adjustedWorkTime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/adjustedWorkTime'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                title: "adjustedWorkTimeResponseBody"
                type: object
                additionalProperties: false
                properties:
                  checkSum:
                    type: string
                    format: guid
                    example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
                  adjustedWorkTimeInMinutes:
                    type: integer
                    example: 101
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  # ----------------------------------------------------------------------
  /v1/timereportConfiguration/:
    get:
      tags:
        - timereports and shifts
      summary: 'Return timereport settings for the tenant'
      security:
        - visma_connect: [ "transpaapi:timereportconfigurations:read" ]
      description: >
        Required scope transpaapi:timereportconfigurations:read
      operationId: get-timereportconfiguration
      responses:
        '200':
          description: 'Return the timereport settings'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/timereportConfiguration'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'
  # ----------------------------------------------------------------------
  /v1/files:
    get:
      tags:
        - files
      summary: '[Not Ready] Get files metadata'
      security:
        - visma_connect: [ "transpaapi:files:read" ]
      description: >
        Required scope transpaapi:files:read


        The result is filtered based on available scopes:

        | File type | Required Scope |

        |--------|-----------------|

        | salaryExport | transpaapi:salaries:read |
      operationId: get-salaryExportFiles
      parameters:
        - $ref: '#/components/parameters/cursorQueryParameter'
        - name: limit
          description: 'Limits the number of salaryExportFiles returned. Default and maximum is 100'
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: filter
          description: >
            Uses format field:comp:val:op:field:comp:val etc described on GitHub: <https://github.com/Visma-TransPa/TransPA-Public-API-Client/tree/main/examples/Postman>


            Supported fields: fileType, subordinateFileType


            Supported comparators: $eq:, $ne:, $gt:, $lt:, $gte:, $lte:, $in:, $nin:


            Supported operators: $and:, $or:
          in: query
          required: false
          schema:
            type: string
            maxLength: 400
            example: 'fileType$eq:salaryExport$and:subordinateFileType$eq:salaryTransactions'
      responses:
        '200':
          description: 'Return a list of files metadata'
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    $ref: '#/components/schemas/cursorDto'
                  items:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/file'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/files/{id}:
    get:
      tags:
        - files
      summary: '[Not Ready] Get a file'
      security:
        - visma_connect: [ "transpaapi:files:read" ]
      description: >
        Required scope transpaapi:files:read


        In addition, each file requires a specific scope depending on file type:

        | File type | Required Scope |

        |--------|-----------------|

        | salaryExport | transpaapi:salaries:read |
      operationId: get-file
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '200':
          description: File download
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Indicates the file should be downloaded as an attachment'
              example: 'attachment; filename="Transpa AB Month 202604.wli"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'The file does not exist.'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/salaries/{id}:
    get:
      tags:
        - salaries
      summary: 'Get a salary'
      security:
        - visma_connect: [ "transpaapi:salaries:read" ]
      description: >
        Required scope transpaapi:salaries:read
      operationId: get-salary
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/salary'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Salary does not exist'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/salaries/{id}/setExportFailed:
    post:
      tags:
        - salaries
      summary: 'Set salary export status as failed'
      security:
        - visma_connect: [ "transpaapi:salaries:write" ]
      description: >
        Required scope transpaapi:salaries:write
      operationId: post-setExportFailed
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/salaryExportFailed'
      responses:
        '204':
          description: 'Export was set as failed'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Salary does not exist'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/salaries/{id}/setExportSuccess:
    post:
      tags:
        - salaries
      summary: 'Set salary export status as successful'
      security:
        - visma_connect: [ "transpaapi:salaries:write" ]
      description: >
        Required scope transpaapi:salaries:write
      operationId: post-setExportSuccess
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '204':
          description: 'Export was set as successful'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Salary does not exist'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/subscribe/salaries:
    post:
      tags:
        - salaries
      operationId: create-subscription-salaries
      summary: Subscribe to a WebHook for the active tenant
      description: >
        Start subscribing on the provided url for updates regarding the salaries resource. Custom headers can be used for, e.g., authorization.
        <br/>
        Required scope transpaapi:salaries:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webHook'
      callbacks: # Callback definition
        newResource: # Event name
          '{$request.body#/createCallbackUrl}': # The callback URL, refers to the URL passed in the request body
            post:
              requestBody: # Contents of the callback message
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/salaryCreated'
              responses: # Expected responses to the callback message
                '204':
                  description: Your server returns this code if it accepts the callback
      responses:
        '201':
          description: WebHook created
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/unsubscribe/salaries:
    post:
      summary: Unsubscribe the WebHook for the active tenant
      description: >
        Required scope transpaapi:salaries:read
      tags:
        - salaries
      operationId: create-unsubscription-salaries
      responses:
        '204':
          description: WebHook removed
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: No WebHook
        '429':
          $ref: '#/components/responses/429Throttling'
  # ----------------------------------------------------------------------
  /v1/shifts/:
    get:
      tags:
        - timereports and shifts
      summary: 'Return a list of Shifts'
      security:
        - visma_connect: [ "transpaapi:shifts:read" ]
      description: >
        Required scope transpaapi:shifts:read
      operationId: get-shifts
      parameters:
        - $ref: '#/components/parameters/cursorQueryParameter'
        - $ref: '#/components/parameters/limitParameter'
        - name: startDateTimeAfter
          description: 'Starting point for the queried list'
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-02-01T12:00Z'
        - name: startDateTimeBefore
          description: 'Needs to be within 31 days from the startDateTimeAfter'
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-02-28T12:00Z'
      responses:
        '200':
          description: 'Return a list of Shifts'
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    $ref: '#/components/schemas/cursorDto'
                  items:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/shift'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'
    post:
      tags:
        - timereports and shifts
      summary: 'Create a shift'
      security:
        - visma_connect: [ "transpaapi:shifts:write" ]
      description: >
        Required scope transpaapi:shifts:write
      operationId: post-shift
      parameters:
        - $ref: '#/components/parameters/adjustedWorkTimeCheckSum'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shift'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shift'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/shifts/{id}:
    get:
      tags:
        - timereports and shifts
      summary: 'Get a Shift'
      security:
        - visma_connect: [ "transpaapi:shifts:read" ]
      description: >
        Required scope transpaapi:shifts:read
      operationId: get-shift
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shift'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Shift does not exist.'
        '429':
          $ref: '#/components/responses/429Throttling'
    put:
      tags:
        - timereports and shifts
      summary: 'Update a shift'
      security:
        - visma_connect: [ "transpaapi:shifts:write" ]
      description: >
        Update a shift


        Required scope transpaapi:shifts:write
      operationId: put-shift
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
        - $ref: '#/components/parameters/adjustedWorkTimeCheckSum'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shift'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shift'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Shift does not exist'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'
    delete:
      tags:
        - timereports and shifts
      summary: 'Delete a shift'
      security:
        - visma_connect: [ "transpaapi:shifts:delete" ]
      description: >
        Delete a shift


        Required scope transpaapi:shifts:delete
      operationId: delete-shift
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
      responses:
        '204':
          description: 'Removed'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
          description: 'Shift does not exist'
        '409':
          $ref: '#/components/responses/409ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/employees/{id}/shifts/:
    get:
      tags:
        - timereports and shifts
      summary: 'Return a list of Shifts for an employee'
      security:
        - visma_connect: [ "transpaapi:shifts:read" ]
      description: >
        Required scope transpaapi:shifts:read
      operationId: get-employee-shifts
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
        - name: startDateTimeAfter
          description: 'Starting point for the queried list'
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-02-01T12:00Z'
        - name: startDateTimeBefore
          description: 'Needs to be within 31 days from the startDateTimeAfter'
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-02-28T12:00Z'
      responses:
        '200':
          description: 'Return a list of Shifts'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/shift'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
            description: 'Employee does not exist'
        '429':
          $ref: '#/components/responses/429Throttling'

  # ----------------------------------------------------------------------
  /v1/stationPlaces:
    get:
      tags:
        - stationPlaces
      summary: 'Return a list of Station Places'
      security:
        - visma_connect: [ "transpaapi:stationplaces:read" ]
      description: >
        Required scope transpaapi:stationplaces:read
      operationId: get-stationplaces
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/stationPlace'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '429':
          $ref: '#/components/responses/429Throttling'
  # ----------------------------------------------------------------------
  /v1/employees/{id}/timereports/:
    get:
      tags:
        - timereports and shifts
      summary: 'Return a list of TimeReports for an employee'
      security:
        - visma_connect: [ "transpaapi:timereports:read" ]
      description: >
        Required scope transpaapi:timereports:read
      operationId: get-employee-timereports
      parameters:
        - $ref: '#/components/parameters/idPathParameter'
        - name: startDateTimeAfter
          description: 'Starting point for the queried list'
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-02-01T12:00Z'
        - name: startDateTimeBefore
          description: 'Needs to be within 31 days from the startDateTimeAfter'
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2024-02-28T12:00Z'
      responses:
        '200':
          description: 'Return a list of TimeReports'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    nullable: false
                    items:
                      $ref: '#/components/schemas/timeReport'
        '400':
          $ref: '#/components/responses/400ProblemJson'
        '403':
          $ref: '#/components/responses/403ProblemJson'
        '404':
            description: 'Employee does not exist'
        '429':
          $ref: '#/components/responses/429Throttling'

  /v1/timeReports:
    get:
      tags:
        - timereports and shifts
      summary: 'Return a list of TimeReports'
      security:
