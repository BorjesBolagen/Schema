# ----------------------------------------------------------------------
components:
  schemas:
    address:
      type: object
      properties:
        street:
          description: |
            the full street address including house number and street name
          type: string
          default: ''
          maxLength: 50
          pattern: ^([\p{L}0-9_\-']+([ ][\p{L}0-9_\-']+)*)?$
          example: Tradenvägen 18
        city:
          description: |
            name of the city / locality
          type: string
          default: ''
          maxLength: 30
          pattern: ^([\p{L}0-9_\-']+([ ][\p{L}0-9_\-']+)*)?$
          example: Munkedal
        postalCode:
          description: |
            zip code or postal code
          type: string
          default: ''
          maxLength: 10
          example: 455 91
          pattern: ^([0-9_\-]+([ ][0-9_\-]+)*)?$
    employee:
      title: "employee"
      type: object
      additionalProperties: false
      required:
        - firstName
        - lastName
        - signature
      properties:
        id:
          type: string
          format: guid
          example: 'b1df383d-23f5-4aa3-118c-bbb551abfd9d'
        firstName:
          type: string
          example: 'John'
          minLength: 2
          maxLength: 30
          pattern: ^[\p{L}0-9\.'`\-:~!@#$^&*()_+][\p{L}0-9\s\.'`\-:~!@#$^&*()_+]*$
          description: "Should contain only letters, numbers, space, and the following special characters: '-:~!@#$^&*()_+ but must not start with a space."
        lastName:
          type: string
          example: 'Doe'
          minLength: 2
          maxLength: 30
          pattern: ^[\p{L}0-9\.'`\-:~!@#$^&*()_+][\p{L}0-9\s\.'`\-:~!@#$^&*()_+]*$
          description: "Should contain only letters, numbers, space, and the following special characters: '-:~!@#$^&*()_+ but must not start with a space."
        employeeNumber:
          nullable: true
          type: integer
          format: int64
          example: 1337
          minimum: 1
        signature:
          type: string
          example: 'JODO'
          minLength: 1
          maxLength: 6
          description: "Needs to be an alphanumeric value"
        isActive:
          type: boolean
        loginEmail:
          type: string
          format: email
          description: "Needs to be a valid email"
          maxLength: 60
        loginPhoneNumber:
          type: string
          description: "Phone used for multi factor authentication (MFA)"
          maxLength: 20
        nationalIdentityNumber:
          type: string
          description: 'Currently only supports Swedish personnummer on formats 198001022386 or 19800102-2386. If you require support for other countries please supply a feature request'
          maxLength: 13
          pattern: ^([0-9]{8}-?[0-9]{4})?$
        tachographCards:
          type: array
          description: 'At present time the system only supports 1 tachograph card. If set, this array will contain that one value. If not set, the array will be empty'
          maxItems: 1
          items:
            properties:
              tachographCardNumber:
                type: string
                description: 'Tachograph Card Numbers can have a length of either 14 or 16'
                example: '0000012345678901'
                maxLength: 16
                pattern: ^([0-9a-zA-Z]{14}([0-9a-zA-Z]{2})?)?$
        address:
          $ref: '#/components/schemas/address'
        professionGroup:
           type: string
           description: 'The profession group the employee belongs to'
           default: 'driver'
           example:
             - 'driver'
             - 'terminal'
             - 'garage'
             - 'other'
        grouping:
          type: object
          properties:
            stationPlaceId:
              type: string
              format: guid
              nullable: true
              example: 'b1df383d-23f5-4aa3-118c-bbb551abfd9d'
            trafficAreaId:
              type: string
              format: guid
              nullable: true
              example: 'c1df383d-23f5-4aa3-118c-bbb551abfd9d'
            workGroupId:
              type: string
              format: guid
              nullable: true
              example: 'd1df383d-23f5-4aa3-118c-bbb551abfd9d'
            supervisorId:
              type: string
              format: guid
              nullable: true
              description: 'Reference to a systemUser acting as supervisor for this employee'
              example: 'e1df383d-23f5-4aa3-118c-bbb551abfd9d'
            vacationGroupId:
              type: string
              format: guid
              nullable: true
              description: 'Reference to the vacation group this employee belongs to'
              example: 'f1df383d-23f5-4aa3-118c-bbb551abfd9d'
    # ----------------------------------------------------------------------
    employeeContract:
      title: "employeeContract"
      type: object
      additionalProperties: false
      properties:
        employeeId:
          type: string
          format: guid
          example: 'b1df383d-23f5-4aa3-118c-bbb551abfd9d'
        collectiveAgreement:
          type: string
          description: 'The contracts collective agreement'
          example:
            - 'transport' # Transport Agreement
            - 'bus' # Bus Agreement
            - 'tma' # Civil Service Agreement (Tjänstemannaavtalet in Swedish)
            - 'mfa' # Machine Drive Agreement (Maskinföraravtalet in Swedish)
            - 'other'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
    # ----------------------------------------------------------------------
    httpHeader:
      title: "httpHeader"
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
          example: "Authorization"
        value:
          type: string
          maxLength: 255
          example: "Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6IjVENDcxQ"
    # ----------------------------------------------------------------------
    money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          description: Amount expressed as a decimal number of major currency units
          format: decimal
          example: 99.95
        currency:
          type: string
          description: 3 letter currency code as defined by ISO-4217
          format: iso-4217
          example: SEK
      required:
        - amount
        - currency
    # ----------------------------------------------------------------------
    weekday:
      type: string
      enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
    # ----------------------------------------------------------------------
    adjustedWorkTime:
      title: "adjustedWorkTime"
      type: object
      additionalProperties: false
      required:
        - startDateTime
        - breaks
        - partsOfDay
      properties:
        startDateTime:
          type: string
          format: date-time
          example: "2024-02-01T08:00Z"
        breaks:
          type: array
          maxItems: 4
          minItems: 0
          items:
            type: object
            required:
              - startDateTime
              - endDateTime
            properties:
              startDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:00Z"
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:45Z"
        employeeId:
          type: string
          format: guid
          nullable: true
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        partsOfDay:
          type: array
          title: 'adjustedWorkTimePartsOfDay'
          minItems: 1
          maxItems: 50
          items:
            required:
              - endDateTime
            type: object
            properties:
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T16:00Z"
                description: 'For the last part of the day, this value is also the time when the timereport/shift ends. And that needs to be after and within 24 hours of the startDateTime'
              workTaskId:
                nullable: true
                type: string
                format: guid
                example: "bbb2f855-debb-4f17-b7c9-2626a2b9c819"
        collectiveAgreement:
          type: string
          nullable: true
          description: 'Can not be used in combination with employeeId'
          example:
            - 'transport' # Transport Agreement
            - 'bus' # Bus Agreement
            - 'tma' # Civil Service Agreement (Tjänstemannaavtalet in Swedish)
            - 'mfa' # Machine Drive Agreement (Maskinföraravtalet in Swedish)
            - 'other'
        professionGroup:
          type: string
          nullable: true
          description: 'Can only be used in combination with collectiveAgreement'
          example:
            - 'driver'
            - 'terminal'
            - 'garage'
            - 'other'
    # ----------------------------------------------------------------------
    wageRow:
      title: "wageRow"
      type: object
      properties:
        payTypeCode:
          type: string
          example: '51101'
        unitPrice:
          $ref: '#/components/schemas/money'
        quantity:
          type: number
          description: Number expressed as a decimal number
          format: decimal
          example: 99.95
        details:
          type: array
          nullable: false
          items:
            type: object
            properties:
              fromDate:
                type: string
                format: date
              toDate:
                type: string
                format: date
              quantity:
                type: number
                description: Number expressed as a decimal number
                format: decimal
                example: 99.95
              unitPrice:
                $ref: '#/components/schemas/money'
    # ----------------------------------------------------------------------
    timeRow:
      title: "timeRow"
      type: object
      properties:
        payTypeCode:
          type: string
          example: '51000'
        details:
          type: array
          nullable: false
          items:
            type: object
            properties:
              fromDate:
                type: string
                format: date
              toDate:
                type: string
                format: date
              quantity:
                type: number
                description: Number expressed as a decimal number
                format: decimal
                example: 99.95
      # ----------------------------------------------------------------------
    file:
      title: "file"
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: guid
          example: 'b1df383d-23f5-4aa3-118c-bbb551abfd9d'
        createdAt:
          type: string
          format: date-time
          example: "2026-02-01T08:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-02-01T08:00Z"
        fullFileName:
          type: string
          example: "Transpa AB Month 202604.wli"
        fileType:
          type: string
          example:
            - 'salaryExport'
        subordinateFileType:
          type: string
          nullable: true
          description: >
            Some fileTypes have a subordinateFileType as listed in this table:

            | File type | Subordinate type |

            |--------|-----------------|

            | salaryExport | salaryTransactions, employeeSchedules, employeeDetails |
      # ----------------------------------------------------------------------
    salary:
      title: "salary"
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: guid
          example: 'a1df383d-23f5-4aa3-118c-bbb551abfd9d'
        startDate:
          type: string
          format: date
          description: 'The first date of the wage period'
        endDate:
          type: string
          format: date
          description: 'The last date of the wage period'
        employeeId:
          type: string
          format: guid
          example: 'b1df383d-23f5-4aa3-118c-bbb551abfd9d'
        wageRows:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/wageRow'
        timeRows:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/timeRow'

    salaryCreated:
      title: "salaryCreated"
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          example: Resource created
          description: 'Human readable string'
        resourceUrl:
          type: string
          format: url
          example: 'https://api.mytranspa.com/publicApi/v1/salaries/a1df383d-23f5-4aa3-118c-bbb551abfd9d'
        tenantId:
          type: string
          format: guid
          example: 'b1df383d-23f5-4aa3-118c-bbb551abaaaa'
      required:
        - title
        - resourceUrl
        - tenantId

    salaryConfiguration:
      title: "salaryConfiguration"
      type: object
      additionalProperties: false
      properties:
        vacationWagePerDay:
          type: number
          description: Vacation wage per day used in salary calculations
          format: decimal
          minimum: 0
          example: 1024.01

    salaryExportFailed:
      title: "salaryExportFailed"
      type: object
      additionalProperties: false
      properties:
        statusCode:
          type: string
          example:
            - 'failedClientNotResponding'
            - 'failedClientLackAccessToTenant'
            - 'failedPayTypeCodeBadFormat'
            - 'failedPayTypeCodeUnknown'
            - 'failedEmployeeNumberBadFormat'
            - 'failedEmployeeNumberUnknown'
            - 'failedUnspecified'
        customInfo:
          type: string
          example: 'You may write a custom info here that will be displayed to the user'
          maxLength: 150
      required:
        - statusCode
    # ----------------------------------------------------------------------
    shift:
      title: "shift"
      type: object
      additionalProperties: false
      required:
        - startDateTime
        - breaks
        - partsOfDay
        - adjustedWorkTimeInMinutes
      properties:
        id:
          type: string
          format: guid
          example: "ffe8e591-e53b-4372-99f4-7bc162624b67"
        startDateTime:
          type: string
          format: date-time
          example: "2024-02-01T08:00Z"
        breaks:
          type: array
          maxItems: 4
          minItems: 0
          items:
            type: object
            required:
              - startDateTime
              - endDateTime
            properties:
              startDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:00Z"
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:45Z"
        employeeId:
          type: string
          format: guid
          nullable: true
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        externalId:
          type: string
          minLength: 5
          maxLength: 50
          nullable: true
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 1000
        partsOfDay:
          type: array
          minItems: 1
          maxItems: 50
          items:
            required:
              - endDateTime
            type: object
            properties:
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T17:00Z"
                description: 'For the last part of the day, this value is also the time when the shift ends. And that needs to be after and within 24 hours of the startDateTime'
              vehicleId:
                nullable: true
                type: string
                format: guid
                example: "aaa2f855-debb-4f17-b7c9-2626a2b9c819"
              workTaskId:
                nullable: true
                type: string
                format: guid
                example: "bbb2f855-debb-4f17-b7c9-2626a2b9c819"
              customCounters:
                type: object
                description: 'By default the custom counters are meter readings when enabled. But they can also be used for other purposes like keeping track of differential changes of a custom counter.'
                properties:
                  customCounterOne:
                    type: number
                    format: double
                    example: 80000.3
                  customCounterTwo:
                    type: number
                    format: double
                    example: 80150.4
              trailerVehicleId:
                nullable: true
                type: string
                format: guid
                example: "ccc2f855-debb-4f17-b7c9-2626a2b9c819"
              costDistributionCode:
                type: string
                minLength: 1
                nullable: false
                default: '0'
                description: 'If omitted, default to either 0 or the value set on the vehicle (if configured). Must be a non-negative integer (int32).'
                example: '1010'
        isExtraShift:
          type: boolean
          default: false
          description: 'Indicates if the shift is an extra shift outside of normal working hours'
        adjustedWorkTimeInMinutes:
          type: integer
          description: This value is calculated in the calculateAdjustedWorkTime resource
          example: 100
          minimum: 1
          maximum: 1440
    stationPlace:
      title: "stationPlace"
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: guid
          example: "ffe8e591-e53b-4372-99f4-7bc162624b67"
        name:
          type: string
    # ----------------------------------------------------------------------
    tachographDataAbstraction:
      title: "tachographDataAbstraction"
      type: object
      additionalProperties: false
      required:
        - startDateTime
        - breaks
        - partsOfDay
        - employeeId
      properties:
        id:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        employeeId:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        startDateTime:
          type: string
          format: date-time
          example: "2024-02-01T08:00Z"
        breaks:
          type: array
          minItems: 0 # Compared to timereports, abstractions doesn't have a upper bound on the number of breaks. But if we create a POST/PUT we would need to add an upper bound here.
          items:
            type: object
            required:
              - startDateTime
              - endDateTime
            properties:
              startDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:00Z"
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:45Z"
        missingData:
          type: array
          minItems: 0
          items:
            type: object
            required:
              - startDateTime
              - endDateTime
            properties:
              startDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:00Z"
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:45Z"
        partsOfDay:
          type: array
          minItems: 1 # Compared to timereports, abstractions doesn't have a upper bound on the number of partsOfDay. But if we create a POST/PUT we would need to add an upper bound here.
          items:
            required:
              - endDateTime
            type: object
            properties:
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T17:00Z"
                description: 'For the last part of the day, this value is also the time when the abstraction ends.' # Compared to timereports, abstractions doesn't have a upper bound on the endDateTime. In odd edge cases abstraction can span over several days.'
              vehicleRegistrationNumber:
                nullable: true
                type: string
                minLength: 1
                maxLength: 20
                example: 'ABC-123'
        updatedAt:
          type: string
          format: date-time
          example: "2024-02-01T12:50:12.345Z"
        dataStability:
          type: string
          description: 'Indicates the reliability of the abstraction based on data volume. If data is insufficient, the state remains volatile.'
          default: 'unverified'
          example:
            - 'unverified' # Not processed yet
            - 'volatile'   # Has data, but may change as more data arrives
            - 'stable'     # Enough data collected; no further changes expected
    # ----------------------------------------------------------------------
    timeReport:
      title: "timeReport"
      type: object
      additionalProperties: false
      required:
        - startDateTime
        - breaks
        - partsOfDay
        - employeeId
        - adjustedWorkTimeInMinutes
      properties:
        id:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        startDateTime:
          type: string
          format: date-time
          example: "2024-02-01T08:00Z"
        breaks:
          type: array
          maxItems: 4
          minItems: 0
          items:
            type: object
            required:
              - startDateTime
              - endDateTime
            properties:
              startDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:00Z"
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T12:45Z"
        employeeId:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        status:
          type: string
          default: 'submitted'
          example:
            - 'submitted'
            - 'approved'
        timeBalanceOption:
          type: string
          default: 'noTimeSubstitution'
          example:
           - 'noTimeSubstitution'
           - 'useCompForOverAndUndertime'
           - 'useFlexForOverAndUndertime'
        note:
          type: string
          maxLength: 1000
        partsOfDay:
          type: array
          minItems: 1
          maxItems: 50
          items:
            required:
              - endDateTime
            type: object
            properties:
              endDateTime:
                type: string
                format: date-time
                example: "2024-02-01T17:00Z"
                description: 'For the last part of the day, this value is also the time when the time report ends. And that needs to be after and within 24 hours of the startDateTime'
              vehicleId:
                nullable: true
                type: string
                format: guid
                example: "aaa2f855-debb-4f17-b7c9-2626a2b9c819"
              trailerVehicleId:
                nullable: true
                type: string
                format: guid
                example: "ccc2f855-debb-4f17-b7c9-2626a2b9c819"
              workTaskId:
                nullable: true
                type: string
                format: guid
                example: "bbb2f855-debb-4f17-b7c9-2626a2b9c819"
              customCounters:
                type: object
                description: 'By default the custom counters are meter readings when enabled. But they can also be used for other purposes like keeping track of differential changes of a custom counter.'
                properties:
                  customCounterOne:
                    type: number
                    format: double
                    example: 80000.3
                  customCounterTwo:
                    type: number
                    format: double
                    example: 80150.4
              costDistributionCode:
                type: string
                minLength: 1
                nullable: false
                default: '0'
                description: 'If omitted, default to either 0 or the value set on the vehicle (if configured). Must be a non-negative integer (int32).'
                example: '1010'
        adjustedWorkTimeInMinutes:
          type: integer
          description: This value is calculated in the calculatedAdjustedWorkTime resource
          example: 100
          minimum: 1
          maximum: 1440
    # ----------------------------------------------------------------------
    webHook:
      type: object
      required:
        - createCallbackUrl
        - customHeaders
      properties:
        createCallbackUrl:
          type: string
          description: Callback URL
          format: uri,
          example: https://myserver.com/send/callback/here
        customHeaders:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/httpHeader'
    # ----------------------------------------------------------------------
    tachographData:
      title: "tachographData"
      type: object
      required:
        - employeeId
        - startDateTime
        - endDateTime
        - activityType
      properties:
        id:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        createdAt:
          type: string
          format: date-time
          example: "2024-02-01T08:00Z"
        employeeId:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        activityType: # Called mode trace https://en.wikipedia.org/wiki/Tachograph
          type: string
          example:
            - 'drive'
            - 'otherWork'
            - 'rest'
            - 'available'
            - 'unknown'
        vehicleRegistrationNumber:
          type: string
          nullable: true
          description: 'Vehicle registration number'
          pattern: ^([\p{L}0-9]+([ \-][\p{L}0-9]+)*)?$
          minLength: 1
          maxLength: 20
          example: 'ABC-123'
    # ----------------------------------------------------------------------
    preliminaryTachographData:
      title: "preliminaryTachographData"
      type: object
      properties:
        tachographCardNumber:
          type: string
          description: 'Tachograph Card Numbers can have a length of either 14 or 16'
          example: '0000012345678901'
          maxLength: 16
          pattern: ^([0-9a-zA-Z]{14}([0-9a-zA-Z]{2})?)?$
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        activityType: # Called mode trace https://en.wikipedia.org/wiki/Tachograph
          type: string
          example:
            - 'drive'
            - 'otherWork'
            - 'rest'
            - 'available'
            - 'unknown'
        vehicleRegistrationNumber:
          type: string
          nullable: true
          description: 'Vehicle registration number (We are not the data owner of this field)'
          minLength: 1
          maxLength: 20
          example: 'ABC-123'
        integratorId:
          type: string
          example:
            - 'api' # Data originating from our Public API
            - 'other'
    # ----------------------------------------------------------------------
    timereportConfiguration:
      title: "timereportConfiguration"
      type: object
      additionalProperties: false
      required:
        - vehicleIsMandatory
        - balances
        - timeLimitInTheFutureInMinutes
      properties:
        customCounters:
          type: object
          properties:
            customCounterOne:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                name:
                  type: string
                  maxLength: 30
            customCounterTwo:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                name:
                  type: string
                  maxLength: 30
        useTrailer:
          type: boolean
          default: false
          description: 'If true, the trailerVehicleId in the partsOfDay can be used'
        timeLimitInTheFutureInMinutes:
          type: integer
          example: 101
          minimum: 0
          maximum: 1440
          default: 15
          description: 'States the number of minutes the timereport can be reported before-hand.'
        vehicleIsMandatory:
          type: boolean
        balances:
          type: object
          nullable: false
          properties:
            allowUseComp:
              type: boolean
              default: true
        securityChecks:
          type: object
          description: 'Settings that control when and for who security checks are done'
          properties:
            vehicleAndDriver:
              type: object
              properties:
                active:
                  type: boolean
                weekdays:
                  type: array
                  items:
                    $ref: '#/components/schemas/weekday'
                  example:
                    - monday
                    - thursday
                professionGroups:
                  type: array
                  items:
                    type: string
                    example:
                      - 'driver'
                      - 'terminal'
                      - 'garage'
                      - 'other'
            trailer:
              type: object
              properties:
                active:
                  type: boolean
                weekdays:
                  type: array
                  items:
                    $ref: '#/components/schemas/weekday'
                  example:
                    - monday
                    - thursday
                professionGroups:
                  type: array
                  items:
                    type: string
                    example:
                      - 'driver'
                      - 'terminal'
                      - 'garage'
                      - 'other'
        worktimeRegulations:
          type: object
          description: 'For rules to be applied, the status need to be either informAboutViolation or informAndPreventViolation'
          properties:
            status:
              type: string
              default: 'disabled'
              example:
                - 'disabled'
                - 'informAboutViolation'
                - 'informAndPreventViolation'
            rules:
              type: object
              properties:
                exceeds6HoursWithoutBreakViolation:
                  type: boolean
                  default: true
                missing30MinutesBreakViolation:
                  type: boolean
                  default: true
                missing45MinutesBreakViolation:
                  type: boolean
                  default: true
                exceeds10HoursNightlyViolation:
                  type: boolean
                  default: true
        costDistribution:
          type: object
          additionalProperties: false
          properties:
            vehicleRegisterAsDefault:
              type: boolean
              default: false
            useCostDistribution:
              type: boolean
              default: false
        changesByEmployeeRequiresDocumentation:
          type: string
          description: 'Controls whether documentation is required when an employee changes a timereport.'
          default: 'always'
          example:
            - 'always'
            - 'never'
            - 'optional'
        changesBySystemUserRequiresDocumentation:
          type: string
          description: 'Controls whether documentation is required when a system user changes a timereport.'
          default: 'always'
          example:
            - 'always'
            - 'never'
            - 'optional'
    trafficArea:
      title: "trafficArea"
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        name:
          type: string
    # ----------------------------------------------------------------------
    trip:
      title: "trip"
      type: object
      additionalProperties: false
      required:
        - employeeId
        - startDateTime
        - endDateTime
      properties:
        id:
          type: string
          format: guid
          example: "e1a2f855-debb-4f17-b7c9-2626a2b9c819"
        employeeId:
          type: string
          format: guid
          example: "b1df383d-23f5-4aa3-118c-bbb551abfd9d"
        startDateTime:
          type: string
          format: date-time
          example: "2024-02-01T08:00Z"
        endDateTime:
          type: string
          format: date-time
          example: "2025-01-05T17:00:00Z"
          description: 'This value needs to be after and within 31 days of the startDateTime.'
        status:
          type: string
          default: 'submitted'
          example:
            - 'submitted'
            - 'approved'
        borderCrossings:
          type: array
          nullable: false
          maxItems: 20
          items:
            type: object
            required:
              - country
              - crossingDateTime
            properties:
              country:
                  type: string
                  example: 'SE'
                  description: ISO 3166-1 alpha-2 country code'
              crossingDateTime:
                  type: string
                  format: date-time
                  example: "2024-02-01T12:00Z"
        allowanceReductions:
          type: array
          items:
            type: object
            required:
              - reductionDate
              - type
            properties:
              reductionDate:
                type: string
                format: date
              freeAccommodation:
                type: boolean
                description: Available in Transport, Bus, MFA and TMA agreements
                default: false
              freeBreakfast:
                type: boolean
                description: Available in Bus and TMA agreements
                default: false
              freeLunch:
                type: boolean
                description: Available in Bus and TMA agreements
                default: false
              freeDinner:
                type: boolean
                description: Available in Bus and TMA agreements
                default: false

    # ----------------------------------------------------------------------
    vehicle:
      title: "vehicle"
      type: object
      additionalProperties: false
      required:
        - registrationNumber
        - externalId
        - isActive
      properties:
        id:
          type: string
          format: guid
          example: "31621ed5-7514-4c25-b2d1-faf7f149eb1b"
        registrationNumber:
          type: string
          description: 'The registrationNumber cannot be null or empty'
          minLength: 1
          maxLength: 20
          example: 'ABC-123'
        externalId:
          type: string
          description: 'Currently only allows int64 as string (Was previously named VehicleNumber)'
          example: '100'
        vehicleType:
          type: string
          description: 'The type of vehicle'
          default: 'other'
          example:
            - 'other'
            - 'trailer'
        isActive:
          type: boolean
        costDistributionCode:
          type: string
          minLength: 1
          nullable: false
          default: '0'
          description: 'Must be a non-negative integer (int32).'
        trafficAreaId:
          type: string
          format: guid
          nullable: true
          example: "4fe0b8eb-5464-4a19-b848-ed1510a442b3"
        stationPlaceId:
          type: string
          format: guid
          nullable: true
          example: "57b96bc7-2c97-49eb-8899-3bf2f330b789"
        vehicleGroupId:
          type: string
          format: guid
          nullable: true
          example: "6a278d10-95b1-4fd8-926f-eba387cdfd04"
    # ----------------------------------------------------------------------
    vehicleGroup:
      title: "vehicleGroup"
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: guid
          example: "ad26385e-67dc-48f6-8a3a-4c2c21be9a5c"
        name:
          type: string
        isActive:
          type: boolean
          default: true
    # ----------------------------------------------------------------------
    workGroup:
      title: "workGroup"
      additionalProperties: false
      description: "A work group is a way to group employees for various purposes. One example is to use work groups to represent different departments in the company."
      type: object
      properties:
        id:
          type: string
          format: guid
          example: "ad26385e-67dc-48f6-8a3a-4c2c21be9a5c"
        name:
          type: string
          maxLength: 20
        isActive:
          type: boolean
    # ----------------------------------------------------------------------
    workTask:
      title: "workTask"
      type: object
      properties:
        id:
          type: string
          format: guid
          example: "ad26385e-67dc-48f6-8a3a-4c2c21be9a5c"
        description:
          type: string
    # ----------------------------------------------------------------------
    cursorDto:
      title: cursor
      description: >
        If there are too many elements to return the entire list a cursor is provided. The cursor is used for querying for more data
        by using the 'cursor=nextToken' query parameter.
      type: object
      additionalProperties: false
      nullable: true
      properties:
        nextToken:
          type: string
          format: guid
          nullable: true
          description: >
            Token that can be used with the 'cursor=nextToken' query parameter to retrieve the next elements in the list.
            If no value is returned it means that there is no more data available.
          example: "b1df383d-23f5-4aa3-118c-bbb551abfd9d"
    # ----------------------------------------------------------------------
    problem:
      title: problem
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          nullable: true
          description: |
            An absolute URI that identifies the problem type.  When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: 'about:blank'
          example: 'https://zalando.github.io/problem/constraint-violation'
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized); example: Service Unavailable
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence
            of the problem.
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: Connection to database timed out
        instance:
          type: string
          format: uri
          nullable: true
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
  # ----------------------------------------------------------------------
  parameters:
    cursorQueryParameter:
      name: cursor
      description: Pagination token used to query for the next part of a list. Empty string gives the same behavior as not providing the query parameter.
      in: query
      required: false
      schema:
        type: string
        format: guid
    limitParameter:
      name: limit
      description: Limits the number of resources returned. Default and maximum is 100.
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 100
        maximum: 100
    limitParameter200:
      name: limit
      description: Limits the number of resources returned. Default is 100 and maximum is 200.
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 100
        maximum: 200
    idPathParameter:
      name: id
      description: Resource ID
      in: path
      required: true
      schema:
        type: string
        format: guid
    adjustedWorkTimeCheckSum:
      name: checkSum
      description: Checksum retrieved from calculateAdjustedWorkTime resource
      in: query
      required: true
      schema:
        type: string
        format: guid
  responses:
    400ProblemJson:
      description: 'Bad request. Invalid request made by the client'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          example:
            title: 'Bad Request'
            status: 400
            detail: 'Requests contains an invalid field'
    403ProblemJson:
      description: 'Insufficient access'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          example:
            title: 'Forbidden'
            status: 403
            detail: 'Missing required scope'
    409ProblemJson:
      description: 'Resource attribute conflict'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          example:
            title: 'Conflict'
            status: 409
            detail: 'An attribute needs to be unique'
    429Throttling:
      description: 'Throttling has occurred. Either your clients limit is reached or the global limit has been reached'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          example:
            title: 'Too Many Requests'
            status: 429
            detail: 'Global throttling limit reached'
    # ----------------------------------------------------------------------
  securitySchemes:
    visma_connect:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://connect.identity.stagaws.visma.com/connect/token
          scopes:
            "transpaapi:api": Grants access to the API
            "transpaapi:employees:read": Grants access to read employees and it's related resources
            "transpaapi:employees:write": Grants access to write employees and it's related resources
            "transpaapi:employees:delete": Grants access to delete employees and it's related resources
            "transpaapi:employeecontracts:read": Grants access to read employee contracts
            "transpaapi:salaries:read": Grants access to read salaries
            "transpaapi:salaries:write": Grants access to write salaries
            "transpaapi:employeesalaryconfigurations:read": Grant access to read salary configuration
            "transpaapi:employeesalaryconfigurations:write": Grant access to write salary configuration
            "transpaapi:preliminarytachographdata:read": (Visma internal) Grants access to read preliminary tachograph data
            "transpaapi:shifts:read": Grants access to read shifts
            "transpaapi:shifts:write": Grants access to write shifts
            "transpaapi:shifts:delete": Grants access to delete shifts
            "transpaapi:stationplaces:read": Grants access to read stationPlaces
            "transpaapi:tachographdata:read": Grants access to read tachograph data
            "transpaapi:tachographdata:write": Grants access to write tachograph data
            "transpaapi:timereports:read": Grants access to read time reports
            "transpaapi:timereports:write": Grants access to write time reports
            "transpaapi:timereports:delete": Grants access to detele time reports
            "transpaapi:timereportconfigurations:read": Grants access to read time report settings
            "transpaapi:trafficareas:read": Grants access to read trafficAreas
            "transpaapi:trips:read": Grants access to read trips
            "transpaapi:trips:write": Grants access to write trips
            "transpaapi:trips:delete": Grants access to delete trips
            "transpaapi:vehicles:read": Grants access to read from vehicle resource and it's related resources
            "transpaapi:vehicles:write": Grants access to write to the vehicle resource and it's related resources
            "transpaapi:vehicles:delete": Grants access to delete from vehicle resource and it's related resources
            "transpaapi:vehiclegroups:read": Grants access to read vehicleGroups
            "transpaapi:workgroups:read": Grants access to read workGroups
            "transpaapi:worktasks:read": Grants access to read workTasks
security:
  - visma_connect: [ "transpaapi:api" ]
